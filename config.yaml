name: "Ride Bot"
version: "1.19.1"
slug: "ride_bot"
description: "Telegram-бот для планирования групповых поездок"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
# Healthcheck from src/index.ts (PORT is set in run.sh): 503 when Telegram
# polling stalls, so Supervisor restarts the add-on. Not exposed on the host.
ports:
  8099/tcp: null
watchdog: "http://[HOST]:[PORT:8099]/"
options:
  bot_token: ""
  group_chat_id: ""
  firebase_project_id: ""
  firebase_service_account_json: ""
  default_timezone: "Europe/Moscow"
schema:
  bot_token: str
  group_chat_id: str
  firebase_project_id: str
  firebase_service_account_json: str
  default_timezone: str
